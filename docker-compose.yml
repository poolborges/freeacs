services:
  freeacs-db:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: acs
      MYSQL_USER: acs
      MYSQL_PASSWORD: acs
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./tables/src/main/resources/mysql/install.sql:/docker-entrypoint-initdb.d/install.sql:ro

volumes:
  db_data:
